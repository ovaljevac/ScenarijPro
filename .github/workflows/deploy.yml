name: CI and Deploy

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm test

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Docker image
        run: docker build -t scenarijpro-app:ci .

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
        run: |
          test -n "$EC2_SSH_KEY"
          test -n "$EC2_HOST"
          PORT="${EC2_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/scenarijpro_key
          chmod 600 ~/.ssh/scenarijpro_key
          ssh-keyscan -p "$PORT" "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Upload release to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
        run: |
          test -n "$EC2_USER"
          PORT="${EC2_PORT:-22}"
          tar --exclude='.git' --exclude='node_modules' --exclude='server.log' --exclude='server.err.log' -czf /tmp/scenarijpro-release.tgz .
          ssh -i ~/.ssh/scenarijpro_key -p "$PORT" "$EC2_USER@$EC2_HOST" "rm -rf ~/scenarijpro && mkdir -p ~/scenarijpro"
          scp -i ~/.ssh/scenarijpro_key -P "$PORT" /tmp/scenarijpro-release.tgz "$EC2_USER@$EC2_HOST:~/scenarijpro-release.tgz"
          ssh -i ~/.ssh/scenarijpro_key -p "$PORT" "$EC2_USER@$EC2_HOST" "tar -xzf ~/scenarijpro-release.tgz -C ~/scenarijpro && rm ~/scenarijpro-release.tgz"

      - name: Start containers on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
        run: |
          PORT="${EC2_PORT:-22}"
          ssh -i ~/.ssh/scenarijpro_key -p "$PORT" "$EC2_USER@$EC2_HOST" "cd ~/scenarijpro && docker compose up -d --build"
