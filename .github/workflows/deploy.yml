name: Deploy ScenarijPro

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy on EC2
        run: |
          set -e

          rm -rf ~/ScenarijPro
          git clone https://github.com/ovaljevac/ScenarijPro.git ~/ScenarijPro

          cd ~/ScenarijPro

          sudo docker rm -f scenarijpro-app || true
          sudo docker build -t scenarijpro-app:latest .

          sudo docker run -d \
            --name scenarijpro-app \
            --restart unless-stopped \
            --add-host db:${{ secrets.DB_HOST }} \
            -p 127.0.0.1:3000:3000 \
            scenarijpro-app:latest

          cat > /tmp/www.conf <<APACHE
          <VirtualHost *:80>
              ServerName tim1.arm.com
              ServerAlias www.tim1.arm.com

              ProxyPreserveHost On
              ProxyPass / http://127.0.0.1:3000/
              ProxyPassReverse / http://127.0.0.1:3000/
          </VirtualHost>
          APACHE

          sudo cp /tmp/www.conf /etc/apache2/sites-available/www.conf
          sudo a2enmod proxy proxy_http headers
          sudo a2dissite 000-default.conf || true
          sudo a2ensite www.conf
          sudo systemctl reload apache2

      - name: Health check
        run: |
          sleep 15
          curl -f http://127.0.0.1:3000/health
