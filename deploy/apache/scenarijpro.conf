<VirtualHost *:80>
    ServerName scenarijpro.arm.com
    ServerAlias www.scenarijpro.arm.com

    Redirect permanent / https://scenarijpro.arm.com/
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName scenarijpro.arm.com
    ServerAlias www.scenarijpro.arm.com

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/scenarijpro.crt
    SSLCertificateKeyFile /etc/ssl/private/scenarijpro.key

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
</VirtualHost>
</IfModule>
